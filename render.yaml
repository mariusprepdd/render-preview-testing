projects:
  - name: test-deploy-project
    environments:
      - name: production

      previews:
        generation: manual
        expireAfterDays: 2
      
      services:
      - type: web
        plan: starter
        previews:
          plan: starter
        name: express-backend
        runtime: node
        buildCommand: cd backend && yarn
        startCommand: cd backend && yarn start
        envVars:
        - fromGroup: test-deploy-env-vars
        - key: DB_CONNECTION_STRING
          fromDatabase:
            name: postgres_db
            property: connectionString
      - type: web
        name: render-todo
        runtime: static
        buildCommand: cd frontend && yarn install && yarn build
        staticPublishPath: ./frontend/build

      databases:
      - name: postgres_db
        databaseName: test_db
        user: test_user
        plan: basic-256mb
        previewPlan: basic-256mb
